<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="t d">
  <title id="t">優先劣後システム</title><desc id="d">投資家の優先出資と運営会社の劣後出資により価格下落リスクを抑える仕組み</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#1788c9"/></marker></defs>
  <g font-family="Arial,'Noto Sans JP',sans-serif" text-anchor="middle">
    <text x="210" y="36" font-size="20" font-weight="700" fill="#175f8d">出資時</text><text x="550" y="36" font-size="20" font-weight="700" fill="#175f8d">運用期間中</text><text x="900" y="36" font-size="20" font-weight="700" fill="#175f8d">価格下落時</text>
    <rect x="70" y="70" width="280" height="210" rx="4" fill="#fff" stroke="#1688c9" stroke-width="4"/>
    <rect x="70" y="70" width="280" height="158" fill="#1998d7"/><rect x="70" y="228" width="280" height="52" fill="#76cceb"/>
    <text x="210" y="130" font-size="21" fill="#fff">お客様投資家による優先出資</text><text x="210" y="175" font-size="31" font-weight="700" fill="#fff">4,000万円</text><text x="210" y="206" font-size="20" fill="#fff">80%</text>
    <text x="210" y="251" font-size="16" fill="#164f72">ジェイトラストによる劣後出資</text><text x="210" y="272" font-size="20" font-weight="700" fill="#164f72">1,000万円（20%）</text>
    <rect x="430" y="70" width="240" height="210" rx="4" fill="#fff" stroke="#1688c9" stroke-width="4"/><path d="M470 228h160M485 228V122l65-36 65 36v106M520 228v-58h60v58" fill="none" stroke="#1688c9" stroke-width="4"/>
    <text x="550" y="318" font-size="21" fill="#175f8d">不動産価格</text><text x="550" y="354" font-size="30" font-weight="700" fill="#175f8d">5,000万円</text>
    <rect x="760" y="70" width="280" height="210" rx="4" fill="#fff" stroke="#1688c9" stroke-width="4"/><rect x="760" y="70" width="280" height="158" fill="#1998d7"/><rect x="760" y="228" width="280" height="52" fill="#f2b643"/>
    <text x="900" y="130" font-size="20" fill="#fff">お客様へ優先して償還</text><text x="900" y="175" font-size="31" font-weight="700" fill="#fff">4,000万円</text><text x="900" y="251" font-size="16" fill="#60440a">ジェイトラストが価格下落分を負担</text><text x="900" y="273" font-size="20" font-weight="700" fill="#60440a">500万円</text>
    <path d="M365 175h48M686 175h58" fill="none" stroke="#1688c9" stroke-width="4" marker-end="url(#a)"/>
    <text x="900" y="318" font-size="21" fill="#175f8d">下落後の不動産価格</text><text x="900" y="354" font-size="30" font-weight="700" fill="#175f8d">4,500万円</text>
    <text x="550" y="402" font-size="18" fill="#587080">劣後出資の範囲内の下落は、まず運営会社が負担します</text>
  </g>
</svg>
